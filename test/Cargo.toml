[package]
name = "ethrex-test"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

[features]
rocksdb = ["ethrex-storage/rocksdb"]
l2 = []
c-kzg = [
    "ethrex-common/c-kzg",
    "ethrex-blockchain/c-kzg",
    "ethrex-rpc/c-kzg",
    "ethrex-guest-program/c-kzg",
]
rayon = ["ethrex-levm/rayon"]
# Mirrors ef_tests' `stateless` wiring: eip-8025 must be enabled on every
# crate that cfg-gates on it, or cross-crate cfg mismatches break the build.
eip-8025 = [
    "ethrex-levm/eip-8025",
    "ethrex-blockchain/eip-8025",
    "ethrex-rpc/eip-8025",
    "ethrex-guest-program/eip-8025",
]

[dependencies]
ethrex-common.workspace = true
ethrex-crypto.workspace = true
ethrex-rlp.workspace = true
ethrex-trie.workspace = true
ethrex-p2p = { workspace = true, features = ["test-utils"] }
ethrex-blockchain.workspace = true
ethrex-storage.workspace = true
ethrex-levm.workspace = true
ethrex-rpc.workspace = true

[dev-dependencies]
ethrex-vm.workspace = true
once_cell = "1.21"
rustc-hash.workspace = true
hex.workspace = true
hex-literal.workspace = true
ethereum-types.workspace = true
rkyv.workspace = true
rand.workspace = true
secp256k1.workspace = true
proptest = "1.0.0"
cita_trie = "4.0.0"
hasher = "0.1.4"
p256 = { version = "0.13.2", default-features = false, features = ["ecdsa", "arithmetic"] }
tokio = { workspace = true, features = ["full", "test-util"] }
aes-gcm = "0.10.3"
lazy_static.workspace = true
bytes.workspace = true
serde_json.workspace = true
ethrex.workspace = true
ethrex-l2-common.workspace = true
ethrex-sdk.workspace = true
# Enable SQL for tests so we don't need `cargo test -p ethrex-test --features sql`.
ethrex-storage-rollup = { workspace = true, features = ["sql"] }
anyhow.workspace = true
# L2 integration tests dependencies
ethrex-l2.workspace = true
ethrex-l2-rpc.workspace = true
reqwest.workspace = true
tokio-util.workspace = true
# EIP-8142 guest-program round-trip tests (feature-gated, see [features])
ethrex-guest-program.workspace = true
libssz.workspace = true
libssz-types.workspace = true

[[test]]
name = "ethrex_tests"
path = "tests/tests.rs"

[[test]]
name = "eip8142_native"
path = "tests/eip8142_native.rs"
required-features = ["c-kzg"]

[[test]]
name = "eip8142_guest"
path = "tests/eip8142_guest.rs"
required-features = ["c-kzg", "eip-8025"]

[lints]
workspace = true
